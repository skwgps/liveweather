<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+TC&display=swap');

        :root {
            --bg-color: transparent;
            --card-bg: #162a65;
            --text-main: #ffffff;
            --error-color: #ff0000;
            --marquee-fontsize: 38px;
            --marquee-timefont: 38px;
        }

        * {
            box-sizing: border-box !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        html,
        body {
            width: 100% !important;
            height: 100% !important;
            max-width: 1095px !important;
            max-height: 121px !important;
            overflow: hidden !important;
            background-color: transparent;
            font-family: "WDXL Lubrifont TC", "Microsoft JhengHei", "PMingLiU", sans-serif;
        }

        .weather-card {
            background-color: var(--card-bg);
            width: 100%;
            height: 100%;
            text-align: center;
            text-shadow: 2px 2px 0px #000000;
        }

        .marquee-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0 24px !important;
            position: relative;
            background-color: #162a65;
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.04) 75%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.04) 75%),
                radial-gradient(circle at 10% 50%, #284c9f 0%, transparent 40%),
                radial-gradient(circle at 90% 50%, #284c9f 0%, transparent 40%);
            background-size: 20px 20px, 20px 20px, 100% 100%, 100% 100%;
            box-shadow: inset 0 0 12px #0c183a;
        }

        #marquee-display {
            font-size: var(--marquee-fontsize);
            font-weight: 400;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 100%;
            transition: opacity 0.4s ease-in-out;
            opacity: 1;
            text-shadow: 2px 2px 0px #3264d6, 3px 3px 0px #04040480;
            white-space: nowrap;
            line-height: 1;
            overflow: hidden;
        }

        #marquee-display.is-overflowing {
            justify-content: flex-start;
        }

        #marquee-display.fade {
            opacity: 0;
        }

        .weather-marquee-row {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            white-space: nowrap;
            height: 100%;
            will-change: transform;
            backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
        }

        /* 僅播放「一次」（1 forwards），捲動至結尾後停頓並直接切換下一頁 */
        .scroll-once {
            animation: scrollOnceMarquee var(--scroll-duration, 8s) linear 1 forwards;
        }

        @keyframes scrollOnceMarquee {

            0%,
            15% {
                transform: translate3d(0, 0, 0);
            }

            85%,
            100% {
                transform: translate3d(var(--scroll-dist), 0, 0);
            }
        }

        /* 「明日預報」開場標題：深海軍藍質感底色 + 亮金邊框，完美融入皇家藍菱格背景 */
        .forecast-intro-title {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 10px 34px !important;
            /* 深藍漸層底色，避免半透明黃色混出灰濁感 */
            background: linear-gradient(180deg, #1b367d 0%, #0d1c47 100%);
            border: 2.5px solid #ffd166;
            border-radius: 14px;
            color: #ffe082;
            font-size: calc(var(--marquee-fontsize) + 4px);
            letter-spacing: 5px;
            /* 乾淨的深色立體陰影 + 內層微光，取代原本的亮藍文字重影 */
            text-shadow: 0 3px 0 #08112e, 0 5px 10px rgba(0, 0, 0, 0.65);
            box-shadow:
                0 6px 16px rgba(5, 12, 35, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                0 0 14px rgba(255, 209, 102, 0.25);
            animation: introPopIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* 讓開場標題裡的天氣圖示也有立體感 */
        .forecast-intro-title .current-icon img {
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
        }

        @keyframes introPopIn {
            0% {
                opacity: 0;
                transform: scale(0.82) translateY(6px);
            }

            70% {
                opacity: 1;
                transform: scale(1.04) translateY(0);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .temp-text {
            font-weight: 900;
        }

        .marquee-warning-icons {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .warning-icon-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .warning-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .warning-icon-wrapper.canceled {
            opacity: 1;
        }

        .warning-icon-wrapper.canceled::before,
        .warning-icon-wrapper.canceled::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: var(--error-color);
            border-radius: 1px;
            z-index: 5;
            pointer-events: none;
        }

        .warning-icon-wrapper:not(.canceled)::before {
            content: "";
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            box-shadow:
                0 0 0 2px var(--error-color),
                0 0 8px rgba(255, 77, 77, 0.6);
            pointer-events: none;
            animation: flash 1.5s infinite ease-in-out;
        }

        @keyframes flash {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.0;
            }

            100% {
                opacity: 1;
            }
        }

        .warning-icon-wrapper.canceled::before {
            transform: rotate(45deg);
        }

        .warning-icon-wrapper.canceled::after {
            transform: rotate(-45deg);
        }

        span.temp-symbol {
            font-size: calc(var(--marquee-fontsize) - 8px);
        }

        span.current-icon {
            display: flex;
            align-items: center;
        }

        span.current-icon img {
            width: 44px !important;
            height: 44px !important;
            vertical-align: middle;
        }

        span.current-time {
            font-size: var(--marquee-timefont);
            line-height: 1;
        }

        /* 「明日天氣預報」詳細頁小標籤 */
        .forecast-badge {
            background: linear-gradient(180deg, #1b367d 0%, #0d1c47 100%);
            border: 1.5px solid #ffd166;
            border-radius: 8px;
            padding: 4px 14px !important;
            font-size: calc(var(--marquee-fontsize) - 4px);
            color: #ffe082;
            text-shadow: 0 2px 0 #08112e;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            margin-right: 4px !important;
        }

        /* 精簡版「日曆圖示 + 明日」圓角徽章，大幅節省橫向空間 */
        .forecast-badge-compact {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(180deg, #1b367d 0%, #0d1c47 100%);
            border: 1.5px solid #ffd166;
            border-radius: 10px;
            padding: 5px 12px !important;
            font-size: calc(var(--marquee-fontsize) - 6px);
            font-weight: 700;
            color: #ffe082;
            text-shadow: 0 2px 0 #08112e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* 徽章內的向量小圖示 */
        .forecast-badge-compact svg {
            width: 24px;
            height: 24px;
            stroke: #ffd166;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 2px 0 #08112e);
        }

        /* 氣溫、濕度與天氣描述之間的半透明分隔線 */
        .weather-divider {
            opacity: 0.45;
            margin: 0 4px !important;
        }


        /* 「明日天氣預報」固定在左側時的容器結構 */
        .pinned-forecast-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 固定在最左側的標籤區域（不會跟著捲動） */
        .pinned-left-area {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            height: 100%;
            padding-right: 14px !important;
            position: relative;
            z-index: 10;
        }

        /* 右側真正負責水平捲動的視窗 */
        .scrolling-track-area {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 若右側內容沒有超出寬度，則置中對齊 */
        .scrolling-track-area:not(.is-overflowing) {
            justify-content: center;
        }

        /* 若右側內容超出寬度，則靠左開始捲動 */
        .scrolling-track-area.is-overflowing {
            justify-content: flex-start;
        }
    </style>
</head>

<body>

    <div class="weather-card">
        <div class="marquee-container">
            <div id="marquee-display">正在載入數據...</div>
        </div>
    </div>

    <script>
        const warningIcons = {
            "WFIREY": "firey", "WFIRER": "firer", "WFROST": "frost", "WHOT": "vhot",
            "WCOLD": "cold", "WTS": "ts", "WLIP": "landslip", "WMSGNL": "msn", "WL": "landslip",
            "WTMW": "tsunami-warn", "WRAINA": "raina", "WRAINR": "rainr", "WRAINB": "rainb",
            "WFNTSA": "ntfl", "WFNTERTL": "ntfl", "TC1": "tc1", "TC3": "tc3", "TC8NE": "tc8ne",
            "TC8NW": "tc8nw", "TC8SE": "tc8se", "TC8SW": "tc8sw", "TC9": "tc9", "TC10": "tc10"
        };

        // 解析度比例速度設定：每秒移動「容器寬度」的 8%
        const SCROLL_SPEED_RATIO = 0.05; // 每秒移動容器寬度的百分比
        const MIN_SCROLL_DURATION_SEC = 8; // 單次捲動最短秒數
        const RIGHT_EDGE_OFFSET_PX = 24;   // 捲動結束時右側額外保留的邊距空間

        // 即時天氣變數
        let currentTemp = "--";
        let currentHumidity = "--";
        let warningIconsHtml = "";
        let iconId = "";

        // 明日預報變數
        let tomorrowMinTemp = "--";
        let tomorrowMaxTemp = "--";
        let tomorrowMinrh = "--"; // Min濕度
        let tomorrowMaxrh = "--"; // Max濕度
        let tomorrowWeatherDesc = "暫無預報";
        let tomorrowIconId = "";

        // 輪播狀態：0 = 時鐘, 1 = 即時天氣, 2 = 「明日天氣預報」開場標題 (2秒), 3 = 明日天氣預報詳細內容
        let marqueeState = 2; // 初始由「明日天氣預報」開場提示開始（若想從時鐘開始可改為 0）
        let marqueeTimer = null;
        let hasFetchError = false;
        let errorMessage = "";
        let timeOffset = 0;

        function getAccurateNow() {
            return new Date(Date.now() + timeOffset);
        }

        function getChineseDay(dayIndex) {
            const days = ["日", "一", "二", "三", "四", "五", "六"];
            return "星期" + days.slice(dayIndex, dayIndex + 1);
        }

        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        function formatCurrentTime() {
            const now = getAccurateNow();
            const year = now.getFullYear();
            const month = pad(now.getMonth() + 1);
            const date = pad(now.getDate());
            const hours = pad(now.getHours());
            const minutes = pad(now.getMinutes());
            const seconds = pad(now.getSeconds());
            const dayStr = getChineseDay(now.getDay());

            return `${year}年${month}月${date}日　${dayStr}　${hours}:${minutes}:${seconds}`;
        }

        async function fetchWithFallback(url) {
            try {
                const res = await fetch(url);
                if (res.ok) return res;
            } catch (e) {
                console.log("Direct fetch failed, using fallback...");
            }

            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
            const proxyRes = await fetch(proxyUrl);
            if (!proxyRes.ok) {
                throw new Error("HTTP " + proxyRes.status);
            }
            return proxyRes;
        }

        async function fetchWeatherData() {
            try {
                const rawRhrUrl = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
                const rawWarnUrl = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc';
                const rawFndUrl = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc';

                const [rhrResponse, warnResponse, fndResponse] = await Promise.all([
                    fetchWithFallback(rawRhrUrl),
                    fetchWithFallback(rawWarnUrl),
                    fetchWithFallback(rawFndUrl)
                ]);

                if (!rhrResponse || !warnResponse || !fndResponse) {
                    throw new Error("Network error");
                }

                const rhrData = await rhrResponse.json();
                const warnData = await warnResponse.json();
                const fndData = await fndResponse.json();

                // 1. 解析即時天氣
                if (rhrData && rhrData.temperature && rhrData.temperature.data) {
                    const tempArray = rhrData.temperature.data;
                    const hkoTemp = tempArray.find(item => item.place === "筲箕灣") || tempArray[0];
                    if (hkoTemp) currentTemp = hkoTemp.value;
                }

                if (rhrData && rhrData.humidity && rhrData.humidity.data && rhrData.humidity.data.length > 0) {
                    currentHumidity = rhrData.humidity.data[0].value;
                }

                if (rhrData && rhrData.icon && rhrData.icon.length > 0) {
                    iconId = rhrData.icon[0];
                }

                // 2. 解析明日預報
                if (fndData && fndData.weatherForecast && fndData.weatherForecast.length > 0) {
                    const tomorrowData = fndData.weatherForecast[0];
                    tomorrowMinTemp = tomorrowData.forecastMintemp.value;
                    tomorrowMaxTemp = tomorrowData.forecastMaxtemp.value;
                    tomorrowMinrh = tomorrowData.forecastMinrh.value;
                    tomorrowMaxrh = tomorrowData.forecastMaxrh.value;
                    tomorrowIconId = tomorrowData.ForecastIcon;
                    tomorrowWeatherDesc = (tomorrowData.forecastWeather || "").replace(/\s+/g, ' ').trim();
                }

                // 3. 解析警告圖示
                if (warnData && Object.keys(warnData).length > 0) {
                    let tempIconsHtml = '<span class="marquee-warning-icons">';
                    let iconCount = 0;

                    for (const key in warnData) {
                        if (Object.prototype.hasOwnProperty.call(warnData, key) && iconCount < 5) {
                            const detail = warnData[key];
                            const code = detail.code;
                            const actionCode = detail.actionCode;

                            let iconName = Object.prototype.hasOwnProperty.call(warningIcons, code) ? warningIcons[code] : 'warn';
                            const isCanceled = (actionCode === 'CANCEL');

                            if (isCanceled) {
                                iconName = iconName + '_dim';
                            }

                            tempIconsHtml += `
                            <span class="warning-icon-wrapper ${isCanceled ? 'canceled' : ''}">
                                <img class="warning-icon" src="https://www.hko.gov.hk/tc/wxinfo/dailywx/images/${iconName}.gif" alt="warning">
                            </span>`;
                            iconCount++;
                        }
                    }
                    tempIconsHtml += '</span>';
                    warningIconsHtml = tempIconsHtml;
                } else {
                    warningIconsHtml = "";
                }

                hasFetchError = false;
                errorMessage = "";

            } catch (error) {
                console.error('Fetch Weather Error:', error);
                hasFetchError = true;
                errorMessage = error.message || error.toString();
            }
        }

        function updateLiveClock() {
            const clockEl = document.getElementById('live-clock-target');
            if (clockEl) {
                clockEl.innerHTML = formatCurrentTime();
            }
        }

        function applyOverflowScroll(onCompleteCallback) {
            const displayEl = document.getElementById('marquee-display');
            // 改為偵測右側捲動軌道的寬度（扣除了左側固定標籤後的剩餘寬度）
            const trackEl = displayEl.querySelector('.scrolling-track-area') || displayEl;
            const rowEl = trackEl.querySelector('.weather-marquee-row');

            trackEl.classList.remove('is-overflowing');
            if (!rowEl) return false;

            const containerWidth = trackEl.clientWidth;
            const contentWidth = rowEl.scrollWidth;

            if (contentWidth > containerWidth) {
                const overflowAmount = Math.ceil(contentWidth - containerWidth + RIGHT_EDGE_OFFSET_PX);
                const dynamicSpeedPxPerSec = containerWidth * SCROLL_SPEED_RATIO;
                const durationSec = Math.max(MIN_SCROLL_DURATION_SEC, Number((overflowAmount / dynamicSpeedPxPerSec).toFixed(2)));

                trackEl.classList.add('is-overflowing');
                rowEl.style.setProperty('--scroll-dist', `-${overflowAmount}px`);
                rowEl.style.setProperty('--scroll-duration', `${durationSec}s`);
                rowEl.classList.add('scroll-once');

                rowEl.addEventListener('animationend', () => {
                    if (typeof onCompleteCallback === 'function') {
                        onCompleteCallback();
                    }
                }, { once: true });

                return true;
            }

            return false;
        }

        function rotateMarqueeLoop() {
            clearTimeout(marqueeTimer);
            const displayEl = document.getElementById('marquee-display');
            displayEl.classList.add('fade');

            setTimeout(function () {
                let nextDelay = 20000;
                let handledByAnimation = false;
                displayEl.classList.remove('is-overflowing');

                if (marqueeState === 0) {
                    // 畫面 0：即時日期與時間（停留 60 秒）
                    displayEl.innerHTML = `<span class="current-time" id="live-clock-target">${formatCurrentTime()}</span>`;
                    nextDelay = 60000;
                    marqueeState = 1;

                } else if (marqueeState === 1) {
                    // 畫面 1：即時氣溫、濕度與警告（停留 20 秒）
                    if (hasFetchError) {
                        displayEl.innerHTML = `<span class="error-text">無法顯示即時數據 (${errorMessage})</span>`;
                    } else {
                        const finalIconSrc = iconId ? `<img src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png" alt="Weather Status">` : '';
                        displayEl.innerHTML = `
                        <div class="weather-marquee-row">
                            <span>氣温: <span class="temp-text">${currentTemp}</span><span class="temp-symbol">°C</span></span>
                            <span>&nbsp;濕度: <span class="temp-text">${currentHumidity}</span><span class="temp-symbol">%</span></span>
                            <span class="current-icon">${finalIconSrc}</span>
                            <span>${warningIconsHtml}</span>
                        </div>`;
                    }
                    marqueeState = 2;

                } else if (marqueeState === 2) {
                    // 畫面 2：先以動畫顯示「明日天氣預報」開場標題（停留 2 秒後淡出切換至詳細內容）
                    const tomorrowIconSrc = tomorrowIconId ? `<span class="current-icon"><img src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${tomorrowIconId}.png" alt="Tomorrow Icon"></span>` : '';
                    displayEl.innerHTML = `
                    <div class="forecast-intro-title">
                        ${tomorrowIconSrc}
                        <span>明日天氣預報</span>
                    </div>`;
                    nextDelay = 2000; // 停留 2 秒
                    marqueeState = 3;

                } else {
                    // 畫面 3：左側精簡「日曆圖示 + 明日」徽章 + 右側單次捲動詳細內容
                    marqueeState = 0; // 播完後切換回時鐘
                    if (hasFetchError) {
                        displayEl.innerHTML = `<span class="error-text">無法顯示明日天氣預報</span>`;
                    } else {
                        const tomorrowIconSrc = tomorrowIconId ? `<img src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${tomorrowIconId}.png" alt="Tomorrow Forecast">` : '';
                        displayEl.innerHTML = `
                            <div class="pinned-forecast-wrapper">
                                <div class="pinned-left-area">
                                    <span class="forecast-badge-compact">
                                        <span class="current-icon">${tomorrowIconSrc}</span>
                                    </span>
                                </div>
                                <div class="scrolling-track-area">
                                    <div class="weather-marquee-row">
                                        <span>氣溫: <span class="temp-text">${tomorrowMinTemp} - ${tomorrowMaxTemp}</span><span class="temp-symbol">°C</span></span>
                                        <span class="weather-divider">|</span>
                                        <span>濕度: <span class="temp-text">${tomorrowMinrh} - ${tomorrowMaxrh}</span><span class="temp-symbol">%</span></span>
                                        <span class="weather-divider">|</span>
                                        <span>${tomorrowWeatherDesc}</span>
                                    </div>
                                </div>
                            </div>`;

                        // 啟動單次捲動偵測
                        handledByAnimation = applyOverflowScroll(rotateMarqueeLoop);
                    }
                }

                displayEl.classList.remove('fade');

                if (!handledByAnimation) {
                    marqueeTimer = setTimeout(rotateMarqueeLoop, nextDelay);
                }

            }, 400);
        }

        async function initWidget() {
            await fetchWeatherData();
            rotateMarqueeLoop();
            setInterval(updateLiveClock, 1000);
            setInterval(fetchWeatherData, 200000);
        }

        initWidget();
    </script>
</body>

</html>
