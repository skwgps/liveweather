<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+TC&display=swap');

        * {
            box-sizing: border-box !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        html,
        body {
            width: 100% !important;
            height: 100% !important;
            max-width: 1095px !important;
            max-height: 121px !important;
            overflow: hidden !important;
            background-color: transparent;
            font-family: "WDXL Lubrifont TC", "Microsoft JhengHei", "PMingLiU", sans-serif;
        }

        .weather-card {
            background-color: #162a65;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.04) 75%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.04) 75%),
                radial-gradient(circle at 10% 50%, #284c9f 0%, transparent 40%),
                radial-gradient(circle at 90% 50%, #284c9f 0%, transparent 40%);
            background-size: 20px 20px, 20px 20px, 100% 100%, 100% 100%;
            box-shadow: inset 0 0 12px #0c183a;
        }

        #weather-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <div class="weather-card" id="weather-card">
        <canvas id="weather-canvas"></canvas>
    </div>

    <script>
        // -------------------------------------------------------------------------
        // 1. 全域設定與速度參數 (可隨時微調)
        // -------------------------------------------------------------------------
        const FONT_FAMILY = '"WDXL Lubrifont TC", "Microsoft JhengHei", "PMingLiU", sans-serif';
        const MAIN_FONT_SIZE = 75;          // 主字級 (px)
        const TIME_FONT_SIZE = 75;          // 時鐘字級 (px)
        const SCROLL_SPEED_RATIO = 0.08;    // 解析度比例速度：每秒移動容器寬度的 8%
        const EDGE_PADDING_PX = 24;         // 左右安全留白邊距 (px)
        const FADE_DURATION_SEC = 0.4;      // 畫面淡入淡出時間 (秒)

        const warningIcons = {
            "WFIREY": "firey", "WFIRER": "firer", "WFROST": "frost", "WHOT": "vhot",
            "WCOLD": "cold", "WTS": "ts", "WLIP": "landslip", "WMSGNL": "msn", "WL": "landslip",
            "WTMW": "tsunami-warn", "WRAINA": "raina", "WRAINR": "rainr", "WRAINB": "rainb",
            "WFNTSA": "ntfl", "WFNTERTL": "ntfl", "TC1": "tc1", "TC3": "tc3", "TC8NE": "tc8ne",
            "TC8NW": "tc8nw", "TC8SE": "tc8se", "TC8SW": "tc8sw", "TC9": "tc9", "TC10": "tc10"
        };

        // -------------------------------------------------------------------------
        // 2. 天氣數據與圖片快取 (預先載入圖片確保 Canvas 零延遲繪製)
        // -------------------------------------------------------------------------
        let currentTemp = "--";
        let currentHumidity = "--";
        let currentIconImg = null;
        let warningImgList = []; // { img: Image, canceled: boolean }

        let tomorrowMinTemp = "--";
        let tomorrowMaxTemp = "--";
        let tomorrowMinrh = "--";
        let tomorrowMaxrh = "--";
        let tomorrowWeatherDesc = "暫無預報";
        let tomorrowIconImg = null;

        let hasFetchError = false;
        let errorMessage = "";
        const imageCache = {};

        function loadImageCached(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                if (imageCache[url] && imageCache[url].complete && imageCache[url].naturalWidth > 0) {
                    return resolve(imageCache[url]);
                }
                const img = new Image();
                // Removed img.crossOrigin = "anonymous" because HKO does not send CORS headers
                img.onload = () => {
                    imageCache[url] = img;
                    resolve(img);
                };
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        // -------------------------------------------------------------------------
        // 3. Canvas 狀態機控制 (完全比照流暢版跑馬燈架構)
        // -------------------------------------------------------------------------
        const canvas = document.getElementById('weather-canvas');
        const ctx = canvas.getContext('2d');

        // 輪播畫面狀態：0 = 時鐘, 1 = 即時天氣, 2 = 「明日天氣預報」開場 (2秒), 3 = 明日詳細預報
        let slideState = 2; // 初始從明日天氣預報開始（若需從時鐘開始可改為 0）
        let animPhase = 'FADE_IN'; // 'FADE_IN' | 'HOLD_START' | 'SCROLLING' | 'HOLD_END' | 'FADE_OUT'
        let phaseTimer = 0;
        let fadeAlpha = 0;
        let scrollX = 0;
        let targetScrollX = 0;
        let lastTimestamp = 0;

        function setupAutoResize() {
            const container = document.getElementById('weather-card');
            if (!container) return;

            const observer = new ResizeObserver((entries) => {
                for (let i = 0; i < entries.length; i++) {
                    const entry = entries[i];
                    const dpr = window.devicePixelRatio || 1;
                    canvas.width = entry.contentRect.width * dpr;
                    canvas.height = entry.contentRect.height * dpr;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
            });
            observer.observe(container);
        }

        function getChineseDay(dayIndex) {
            const days = ["日", "一", "二", "三", "四", "五", "六"];
            return "星期" + days[dayIndex];
        }

        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        function formatCurrentTime() {
            const now = new Date();
            return `${now.getFullYear()}年${pad(now.getMonth() + 1)}月${pad(now.getDate())}日 ${getChineseDay(now.getDay())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }

        // 繪製帶立體陰影的清晰文字
        function drawShadowText(text, x, y, font, fillStyle = '#ffffff', shadowColor = '#0a173d') {
            ctx.font = font;
            ctx.fillStyle = shadowColor;
            ctx.fillText(text, x + 3, y + 3);
            ctx.fillStyle = fillStyle;
            ctx.fillText(text, x, y);
        }

        // 繪製圓角矩形輔助函式
        function drawRoundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // 計算畫面 3（明日詳細預報）右側滾動內容總寬度
        function measureTomorrowContentWidth() {
            ctx.font = `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`;
            const part1 = `氣溫: `;
            ctx.font = `900 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`;
            const part2 = `${tomorrowMinTemp} - ${tomorrowMaxTemp}`;
            ctx.font = `400 ${MAIN_FONT_SIZE - 10}px ${FONT_FAMILY}`;
            const part3 = `°C`;
            ctx.font = `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`;
            const part4 = `  |  濕度: `;
            ctx.font = `900 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`;
            const part5 = `${tomorrowMinrh} - ${tomorrowMaxrh}`;
            ctx.font = `400 ${MAIN_FONT_SIZE - 10}px ${FONT_FAMILY}`;
            const part6 = `%`;
            ctx.font = `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`;
            const part7 = `  |  ${tomorrowWeatherDesc}`;

            ctx.font = `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`;
            const w1 = ctx.measureText(part1 + part4 + part7).width;
            ctx.font = `900 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`;
            const w2 = ctx.measureText(part2 + part5).width;
            ctx.font = `400 ${MAIN_FONT_SIZE - 10}px ${FONT_FAMILY}`;
            const w3 = ctx.measureText(part3 + part6).width;

            return w1 + w2 + w3;
        }

        function switchToNextSlide() {
            slideState = (slideState + 1) % 4;
            animPhase = 'FADE_IN';
            phaseTimer = 0;
            scrollX = 0;
            targetScrollX = 0;

            if (slideState === 3 && !hasFetchError) {
                const dpr = window.devicePixelRatio || 1;
                const viewWidth = canvas.width / dpr;
                const pinnedBadgeWidth = 175; // 左側固定「明日 + 圖示」徽章寬度
                const availableTrackWidth = viewWidth - (EDGE_PADDING_PX * 2) - pinnedBadgeWidth;
                const contentWidth = measureTomorrowContentWidth();

                if (contentWidth > availableTrackWidth) {
                    targetScrollX = -(contentWidth - availableTrackWidth + EDGE_PADDING_PX);
                }
            }
        }

        // -------------------------------------------------------------------------
        // 4. 各畫面繪製邏輯
        // -------------------------------------------------------------------------
        function renderSlide0_Clock(viewWidth, viewHeight) {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            drawShadowText(
                formatCurrentTime(),
                viewWidth / 2,
                viewHeight / 2 + 2,
                `400 ${TIME_FONT_SIZE}px ${FONT_FAMILY}`
            );
        }

        function renderSlide1_CurrentWeather(viewWidth, viewHeight) {
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            const centerY = viewHeight / 2 + 2;

            if (hasFetchError) {
                ctx.textAlign = 'center';
                drawShadowText(`無法顯示即時數據 (${errorMessage})`, viewWidth / 2, centerY, `400 ${MAIN_FONT_SIZE - 15}px ${FONT_FAMILY}`, '#ff6b6b');
                return;
            }

            // 計算整體置中起始 X
            ctx.font = `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`;
            const wTempLabel = ctx.measureText('氣溫: ').width;
            const wHumLabel = ctx.measureText('  濕度: ').width;
            ctx.font = `900 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`;
            const wTempVal = ctx.measureText(String(currentTemp)).width;
            const wHumVal = ctx.measureText(String(currentHumidity)).width;
            ctx.font = `400 ${MAIN_FONT_SIZE - 12}px ${FONT_FAMILY}`;
            const wUnitC = ctx.measureText('°C').width;
            const wUnitP = ctx.measureText('%').width;

            const iconSize = 64;
            const warnSize = 52;
            const totalW = wTempLabel + wTempVal + wUnitC + wHumLabel + wHumVal + wUnitP
                + (currentIconImg ? iconSize + 16 : 0)
                + (warningImgList.length > 0 ? warningImgList.length * (warnSize + 8) + 12 : 0);

            let curX = (viewWidth - totalW) / 2;

            drawShadowText('氣溫: ', curX, centerY, `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`);
            curX += wTempLabel;
            drawShadowText(String(currentTemp), curX, centerY, `900 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`);
            curX += wTempVal;
            drawShadowText('°C', curX, centerY + 3, `400 ${MAIN_FONT_SIZE - 12}px ${FONT_FAMILY}`);
            curX += wUnitC;

            drawShadowText('  濕度: ', curX, centerY, `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`);
            curX += wHumLabel;
            drawShadowText(String(currentHumidity), curX, centerY, `900 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`);
            curX += wHumVal;
            drawShadowText('%', curX, centerY + 3, `400 ${MAIN_FONT_SIZE - 12}px ${FONT_FAMILY}`);
            curX += wUnitP;

            if (currentIconImg) {
                curX += 16;
                ctx.drawImage(currentIconImg, curX, (viewHeight - iconSize) / 2, iconSize, iconSize);
                curX += iconSize;
            }

            if (warningImgList.length > 0) {
                curX += 12;
                const nowMs = Date.now();
                const flashOn = Math.floor(nowMs / 750) % 2 === 0;

                for (let i = 0; i < warningImgList.length; i++) {
                    const wItem = warningImgList[i];
                    const wy = (viewHeight - warnSize) / 2;
                    ctx.drawImage(wItem.img, curX, wy, warnSize, warnSize);

                    if (wItem.canceled) {
                        ctx.strokeStyle = '#ff0000';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(curX, wy);
                        ctx.lineTo(curX + warnSize, wy + warnSize);
                        ctx.moveTo(curX + warnSize, wy);
                        ctx.lineTo(curX, wy + warnSize);
                        ctx.stroke();
                    } else if (flashOn) {
                        ctx.strokeStyle = '#ff0000';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(curX - 2, wy - 2, warnSize + 4, warnSize + 4);
                    }
                    curX += warnSize + 8;
                }
            }
        }

        function renderSlide2_IntroTitle(viewWidth, viewHeight) {
            let scale = 1;
            if (animPhase === 'FADE_IN') {
                const t = Math.min(1, phaseTimer / FADE_DURATION_SEC);
                scale = 0.88 + 0.12 * (1 - Math.pow(1 - t, 3));
            }

            ctx.save();
            ctx.translate(viewWidth / 2, viewHeight / 2);
            ctx.scale(scale, scale);

            const titleText = '明日天氣預報';
            // Smaller font size (54px) so it fits comfortably inside the 121px height
            const titleFont = `400 54px ${FONT_FAMILY}`;
            ctx.font = titleFont;
            const textW = ctx.measureText(titleText).width;
            const iconSize = tomorrowIconImg ? 48 : 0;
            const gap = tomorrowIconImg ? 14 : 0;
            const boxW = textW + iconSize + gap + 56;
            const boxH = 74; // Reduced from 96px to 74px so it never overflows vertically

            const grad = ctx.createLinearGradient(0, -boxH / 2, 0, boxH / 2);
            grad.addColorStop(0, '#1b367d');
            grad.addColorStop(1, '#0d1c47');

            drawRoundRect(-boxW / 2, -boxH / 2, boxW, boxH, 14);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#ffd166';
            ctx.stroke();

            let startX = -boxW / 2 + 28;
            if (tomorrowIconImg) {
                ctx.drawImage(tomorrowIconImg, startX, -iconSize / 2, iconSize, iconSize);
                startX += iconSize + gap;
            }

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            drawShadowText(titleText, startX, 2, titleFont, '#ffe082', '#08112e');

            ctx.restore();
        }

        function renderSlide3_TomorrowDetail(viewWidth, viewHeight) {
            const centerY = viewHeight / 2 + 2;

            if (hasFetchError) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                drawShadowText('無法顯示明日天氣預報', viewWidth / 2, centerY, `400 ${MAIN_FONT_SIZE - 15}px ${FONT_FAMILY}`, '#ff6b6b');
                return;
            }

            const badgeX = EDGE_PADDING_PX;
            const badgeW = 145;
            const badgeH = 64;
            const badgeY = (viewHeight - badgeH) / 2;
            const trackStartX = badgeX + badgeW + 18;
            const trackWidth = viewWidth - trackStartX - EDGE_PADDING_PX;

            // 1. 裁切並繪製右側滾動軌道內容
            ctx.save();
            ctx.beginPath();
            ctx.rect(trackStartX, 0, trackWidth, viewHeight);
            ctx.clip();

            const contentW = measureTomorrowContentWidth();
            let drawX = targetScrollX < 0
                ? (trackStartX + scrollX)
                : (trackStartX + (trackWidth - contentW) / 2);

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';

            const segments = [
                { text: '氣溫: ', font: `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`, color: '#ffffff', dy: 0 },
                { text: `${tomorrowMinTemp} - ${tomorrowMaxTemp}`, font: `900 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`, color: '#ffffff', dy: 0 },
                { text: '°C', font: `400 ${MAIN_FONT_SIZE - 12}px ${FONT_FAMILY}`, color: '#ffffff', dy: 4 },
                { text: '  |  ', font: `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`, color: 'rgba(255,255,255,0.45)', dy: 0 },
                { text: '濕度: ', font: `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`, color: '#ffffff', dy: 0 },
                { text: `${tomorrowMinrh} - ${tomorrowMaxrh}`, font: `900 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`, color: '#ffffff', dy: 0 },
                { text: '%', font: `400 ${MAIN_FONT_SIZE - 12}px ${FONT_FAMILY}`, color: '#ffffff', dy: 4 },
                { text: '  |  ', font: `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`, color: 'rgba(255,255,255,0.45)', dy: 0 },
                { text: tomorrowWeatherDesc, font: `400 ${MAIN_FONT_SIZE}px ${FONT_FAMILY}`, color: '#ffffff', dy: 0 }
            ];

            for (let i = 0; i < segments.length; i++) {
                const seg = segments[i];
                drawShadowText(seg.text, drawX, centerY + seg.dy, seg.font, seg.color);
                ctx.font = seg.font;
                drawX += ctx.measureText(seg.text).width;
            }
            ctx.restore();

            // 2. 繪製左側固定「明日 + 天氣圖示」金邊徽章
            const grad = ctx.createLinearGradient(0, badgeY, 0, badgeY + badgeH);
            grad.addColorStop(0, '#1b367d');
            grad.addColorStop(1, '#0d1c47');

            drawRoundRect(badgeX, badgeY, badgeW, badgeH, 12);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffd166';
            ctx.stroke();

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            drawShadowText('明日', badgeX + 12, centerY + 1, `400 34px ${FONT_FAMILY}`, '#ffe082', '#08112e');

            if (tomorrowIconImg) {
                const miniIcon = 54;
                ctx.drawImage(tomorrowIconImg, badgeX + badgeW - miniIcon - 10, (viewHeight - miniIcon) / 2, miniIcon, miniIcon);
            }
        }

        // -------------------------------------------------------------------------
        // 5. 主渲染循環 (requestAnimationFrame + deltaTime 零掉幀引擎)
        // -------------------------------------------------------------------------
        function renderLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            let deltaTime = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;
            if (deltaTime > 0.1) deltaTime = 0.1;

            const dpr = window.devicePixelRatio || 1;
            const viewWidth = canvas.width / dpr;
            const viewHeight = canvas.height / dpr;

            ctx.clearRect(0, 0, viewWidth, viewHeight);
            phaseTimer += deltaTime;

            // 狀態機時間推演
            if (animPhase === 'FADE_IN') {
                fadeAlpha = Math.min(1, phaseTimer / FADE_DURATION_SEC);
                if (phaseTimer >= FADE_DURATION_SEC) {
                    fadeAlpha = 1;
                    animPhase = 'HOLD_START';
                    phaseTimer = 0;
                }
            } else if (animPhase === 'HOLD_START') {
                const holdTime = slideState === 0 ? 60 : (slideState === 1 ? 20 : (slideState === 2 ? 4.0 : (targetScrollX < 0 ? 1.2 : 12)));
                if (phaseTimer >= holdTime) {
                    phaseTimer = 0;
                    if (slideState === 3 && targetScrollX < 0) {
                        animPhase = 'SCROLLING';
                    } else {
                        animPhase = 'FADE_OUT';
                    }
                }
            } else if (animPhase === 'SCROLLING') {
                const speedPxPerSec = viewWidth * SCROLL_SPEED_RATIO;
                scrollX -= speedPxPerSec * deltaTime;
                if (scrollX <= targetScrollX) {
                    scrollX = targetScrollX;
                    animPhase = 'HOLD_END';
                    phaseTimer = 0;
                }
            } else if (animPhase === 'HOLD_END') {
                if (phaseTimer >= 1.5) {
                    animPhase = 'FADE_OUT';
                    phaseTimer = 0;
                }
            } else if (animPhase === 'FADE_OUT') {
                fadeAlpha = Math.max(0, 1 - (phaseTimer / FADE_DURATION_SEC));
                if (phaseTimer >= FADE_DURATION_SEC) {
                    switchToNextSlide();
                }
            }

            // 繪製當前畫面
            ctx.save();
            ctx.globalAlpha = fadeAlpha;

            if (slideState === 0) {
                renderSlide0_Clock(viewWidth, viewHeight);
            } else if (slideState === 1) {
                renderSlide1_CurrentWeather(viewWidth, viewHeight);
            } else if (slideState === 2) {
                renderSlide2_IntroTitle(viewWidth, viewHeight);
            } else {
                renderSlide3_TomorrowDetail(viewWidth, viewHeight);
            }

            ctx.restore();
            requestAnimationFrame(renderLoop);
        }

        // -------------------------------------------------------------------------
        // 6. 香港天文台數據抓取與圖片預載
        // -------------------------------------------------------------------------
        async function fetchWithFallback(url) {
            try {
                const res = await fetch(url);
                if (res.ok) return res;
            } catch (e) { }
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
            const proxyRes = await fetch(proxyUrl);
            if (!proxyRes.ok) throw new Error("HTTP " + proxyRes.status);
            return proxyRes;
        }

        async function fetchWeatherData() {
            try {
                const [rhrRes, warnRes, fndRes] = await Promise.all([
                    fetchWithFallback('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc'),
                    fetchWithFallback('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc'),
                    fetchWithFallback('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc')
                ]);

                const rhrData = await rhrRes.json();
                const warnData = await warnRes.json();
                const fndData = await fndRes.json();

                // 即時氣溫與濕度
                if (rhrData?.temperature?.data) {
                    const tempArray = rhrData.temperature.data;
                    const hkoTemp = tempArray.find(item => item.place === "筲箕灣") || tempArray[0];
                    if (hkoTemp) currentTemp = hkoTemp.value;
                }
                if (rhrData?.humidity?.data?.length > 0) {
                    currentHumidity = rhrData.humidity.data[0].value;
                }
                if (rhrData?.icon?.length > 0) {
                    currentIconImg = await loadImageCached(`https://www.hko.gov.hk/images/HKOWxIconOutline/pic${rhrData.icon[0]}.png`);
                }

                // 明日預報
                if (fndData?.weatherForecast?.length > 0) {
                    const tData = fndData.weatherForecast[0];
                    tomorrowMinTemp = tData.forecastMintemp.value;
                    tomorrowMaxTemp = tData.forecastMaxtemp.value;
                    tomorrowMinrh = tData.forecastMinrh.value;
                    tomorrowMaxrh = tData.forecastMaxrh.value;
                    tomorrowWeatherDesc = (tData.forecastWeather || "").replace(/\s+/g, ' ').trim();
                    if (tData.ForecastIcon) {
                        tomorrowIconImg = await loadImageCached(`https://www.hko.gov.hk/images/HKOWxIconOutline/pic${tData.ForecastIcon}.png`);
                    }
                }

                // 警告圖示預載
                const newWarnImgs = [];
                if (warnData && Object.keys(warnData).length > 0) {
                    let count = 0;
                    for (const key in warnData) {
                        if (Object.prototype.hasOwnProperty.call(warnData, key) && count < 5) {
                            const detail = warnData[key];
                            let iconName = warningIcons[detail.code] || 'warn';
                            const isCanceled = (detail.actionCode === 'CANCEL');
                            if (isCanceled) iconName += '_dim';

                            const wImg = await loadImageCached(`https://www.hko.gov.hk/tc/wxinfo/dailywx/images/${iconName}.gif`);
                            if (wImg) newWarnImgs.push({ img: wImg, canceled: isCanceled });
                            count++;
                        }
                    }
                }
                warningImgList = newWarnImgs;
                hasFetchError = false;
                errorMessage = "";
            } catch (err) {
                hasFetchError = true;
                errorMessage = err.message || "Error";
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            setupAutoResize();
            await fetchWeatherData();
            if (slideState === 3) {
                // 初始化計算首次是否需要滾動
                slideState = 2;
                switchToNextSlide();
            }
            requestAnimationFrame(renderLoop);
            setInterval(fetchWeatherData, 200000);
        });
    </script>
</body>

</html>
