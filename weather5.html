<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+TC&display=swap');

        :root {
            --bg-color: transparent;
            --card-bg: #162a65;
            --text-main: #ffffff;
            --error-color: #ff4d4d;
            /* 將字體適度縮小至 38px，確保加上圖示後垂直絕對置中 */
            --marquee-fontsize: 38px;
            --marquee-timefont: 38px;
        }

        * {
            box-sizing: border-box !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* 強制鎖定視窗，嚴格禁止出現任何滾動條 */
        html,
        body {
            width: 100% !important;
            height: 100% !important;
            max-width: 1095px !important;
            max-height: 121px !important;
            overflow: hidden !important;
            /* 徹底關閉滾動條 */
            background-color: transparent;
            font-family: "WDXL Lubrifont TC", "Microsoft JhengHei", "PMingLiU", sans-serif;
        }

        .weather-card {
            background-color: var(--card-bg);
            width: 100%;
            height: 100%;
            text-align: center;
            text-shadow: 2px 2px 0px #000000;
        }

        /* Marquee Display Area */
        .marquee-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0 8px;
            position: relative;
            background-color: #162a65;
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.04) 75%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.04) 75%),
                radial-gradient(circle at 10% 50%, #284c9f 0%, transparent 40%),
                radial-gradient(circle at 90% 50%, #284c9f 0%, transparent 40%);
            /* 將 60px 縮小至 20px，讓格紋變得非常細緻不被拉伸放大 */
            background-size: 20px 20px, 20px 20px, 100% 100%, 100% 100%;
            box-shadow: inset 0 0 12px #0c183a;
        }

        #marquee-display {
            font-size: var(--marquee-fontsize);
            font-weight: 400;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 100%;
            transition: opacity 0.4s ease-in-out;
            opacity: 1;
            text-shadow: 2px 2px 0px #3264d6, 3px 3px 0px #04040480;
            white-space: nowrap;
            line-height: 1;
            /* 防止字體行高過大擠壓垂直位置 */
        }

        #marquee-display.fade {
            opacity: 0;
        }

        .weather-marquee-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            height: 100%;
        }

        .temp-text {
            font-weight: 900;
        }

        .marquee-warning-icons {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .warning-icon-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .warning-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        span.temp-symbol {
            font-size: calc(var(--marquee-fontsize) - 8px);
        }

        span.current-icon {
            display: flex;
            align-items: center;
        }

        /* 天氣圖示高度限制在 42px 內，避免拉高行高 */
        span.current-icon img {
            width: 42px !important;
            height: 42px !important;
            vertical-align: middle;
        }

        span.current-time {
            font-size: var(--marquee-timefont);
            line-height: 1;
        }
    </style>
</head>

<body>

    <div class="weather-card">
        <div class="marquee-container">
            <div id="marquee-display">正在載入數據...</div>
        </div>
    </div>

    <script>
        const warningIcons = {
            "WFIREY": "firey", "WFIRER": "firer", "WFROST": "frost", "WHOT": "vhot",
            "WCOLD": "cold", "WTS": "ts", "WLIP": "landslip", "WMSGNL": "msn", "WL": "landslip",
            "WTMW": "tsunami-warn", "WRAINA": "raina", "WRAINR": "rainr", "WRAINB": "rainb",
            "WFNTSA": "ntfl", "WFNTERTL": "ntfl", "TC1": "tc1", "TC3": "tc3", "TC8NE": "tc8ne",
            "TC8NW": "tc8nw", "TC8SE": "tc8se", "TC8SW": "tc8sw", "TC9": "tc9", "TC10": "tc10"
        };

        // 快取讀取機制
        let currentTemp = localStorage.getItem('cached_temp') || "--";
        let currentHumidity = localStorage.getItem('cached_humidity') || "--";
        let warningIconsHtml = localStorage.getItem('cached_warn_html') || "";
        let iconId = localStorage.getItem('cached_icon_id') || "";

        let marqueeState = 1;
        let hasFetchError = false;
        let errorMessage = "";

        function getChineseDay(dayIndex) {
            const days = ["日", "一", "二", "三", "四", "五", "六"];
            return "星期" + days[dayIndex];
        }

        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        // 使用本地系統時間
        function formatCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = pad(now.getMonth() + 1);
            const date = pad(now.getDate());
            const hours = pad(now.getHours());
            const minutes = pad(now.getMinutes());
            const seconds = pad(now.getSeconds());
            const dayStr = getChineseDay(now.getDay());

            return `${year}年${month}月${date}日 ${dayStr} ${hours}:${minutes}:${seconds}`;
        }

        async function fetchWithFallback(url) {
            try {
                const res = await fetch(url);
                if (res.ok) return res;
            } catch (e) {
                console.log("Direct fetch failed, using fallback...");
            }
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
            const proxyRes = await fetch(proxyUrl);
            if (!proxyRes.ok) throw new Error("HTTP " + proxyRes.status);
            return proxyRes;
        }

        async function fetchWeatherData() {
            try {
                const rawRhrUrl = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
                const rawWarnUrl = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc';

                const rhrResponse = await fetchWithFallback(rawRhrUrl);
                const warnResponse = await fetchWithFallback(rawWarnUrl);

                if (!rhrResponse || !warnResponse) throw new Error("Network error");

                const rhrData = await rhrResponse.json();
                const warnData = await warnResponse.json();

                if (rhrData && rhrData.temperature && rhrData.temperature.data) {
                    const tempArray = rhrData.temperature.data;
                    const hkoTemp = tempArray.find(item => item.place === "筲箕灣") || tempArray[0];
                    if (hkoTemp) {
                        currentTemp = hkoTemp.value;
                        localStorage.setItem('cached_temp', currentTemp);
                    }
                }

                if (rhrData && rhrData.humidity && rhrData.humidity.data && rhrData.humidity.data.length > 0) {
                    currentHumidity = rhrData.humidity.data[0].value;
                    localStorage.setItem('cached_humidity', currentHumidity);
                }

                if (rhrData && rhrData.icon && rhrData.icon.length > 0) {
                    iconId = rhrData.icon[0];
                    localStorage.setItem('cached_icon_id', iconId);
                }

                if (warnData && Object.keys(warnData).length > 0) {
                    let tempIconsHtml = '<span class="marquee-warning-icons">';
                    let iconCount = 0;

                    for (const key in warnData) {
                        if (Object.prototype.hasOwnProperty.call(warnData, key) && iconCount < 5) {
                            const detail = warnData[key];
                            let iconName = warningIcons[detail.code] || 'warn';
                            const isCanceled = (detail.actionCode === 'CANCEL');
                            if (isCanceled) iconName += '_dim';

                            tempIconsHtml += `
                            <span class="warning-icon-wrapper ${isCanceled ? 'canceled' : ''}">
                                <img class="warning-icon" src="https://www.hko.gov.hk/tc/wxinfo/dailywx/images/${iconName}.gif" alt="warning">
                            </span>`;
                            iconCount++;
                        }
                    }
                    tempIconsHtml += '</span>';
                    warningIconsHtml = tempIconsHtml;
                    localStorage.setItem('cached_warn_html', warningIconsHtml);
                } else {
                    warningIconsHtml = "";
                    localStorage.setItem('cached_warn_html', "");
                }

                hasFetchError = false;
                errorMessage = "";

            } catch (error) {
                console.error('Fetch Weather Error:', error);
                hasFetchError = true;
                errorMessage = error.message || error.toString();
            }
        }

        function updateLiveClock() {
            const clockEl = document.getElementById('live-clock-target');
            if (clockEl) {
                clockEl.textContent = formatCurrentTime();
            }
        }

        function rotateMarqueeLoop() {
            const displayEl = document.getElementById('marquee-display');
            displayEl.classList.add('fade');

            setTimeout(function () {
                if (marqueeState === 0) {
                    displayEl.innerHTML = `<span class="current-time" id="live-clock-target">${formatCurrentTime()}</span>`;
                    marqueeState = 1;
                } else {
                    if (hasFetchError && currentTemp === "--") {
                        displayEl.innerHTML = `<span class="error-text">無法顯示即時數據 (${errorMessage})</span>`;
                    } else {
                        const finalIconSrc = iconId ? `<img src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png" style="width:42px; height:42px; vertical-align:middle;" alt="Weather Status">` : '';
                        displayEl.innerHTML = `
                        <div class="weather-marquee-row">
                            <span>氣温: <span class="temp-text">${currentTemp}</span><span class="temp-symbol">°C</span></span>
                            <span>&nbsp;&nbsp;濕度: <span class="temp-text">${currentHumidity}</span><span class="temp-symbol">%</span></span>
                            <span class="current-icon">${finalIconSrc}</span>
                            <span>${warningIconsHtml}</span>
                        </div>`;
                    }
                    marqueeState = 0;
                }
                displayEl.classList.remove('fade');
                setTimeout(rotateMarqueeLoop, 20000);
            }, 400);
        }

        async function initWidget() {
            rotateMarqueeLoop();
            setInterval(updateLiveClock, 1000);
            await fetchWeatherData();
            setInterval(fetchWeatherData, 200000);
        }

        initWidget();
    </script>
</body>

</html>
