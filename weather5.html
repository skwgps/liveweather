<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+TC&display=swap');

        :root {
            --bg-color: transparent;
            --card-bg: #162a65;
            --text-main: #ffffff;
            --text-muted: #718096;
            --accent-blue: #ff7d00;
            --error-color: #ff4d4d;
            /* 針對 1095x121 精準優化的字體與圖示尺寸 */
            --marquee-fontsize: 48px;
            --marquee-timefont: 48px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 1095px;
            height: 121px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "WDXL Lubrifont TC", "Microsoft JhengHei", "PMingLiU", sans-serif;
        }

        .weather-card {
            background-color: var(--card-bg);
            width: 1095px;
            height: 121px;
            text-align: center;
            text-shadow: 2px 2px 0px #000000, 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        /* Marquee Display Area */
        .marquee-container {
            width: 1095px;
            height: 121px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0 12px;
            position: relative;
            background-color: #162a65;
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.05) 75%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.05) 75%),
                radial-gradient(circle at 10% 15%, #375fb6 0%, transparent 60%),
                radial-gradient(circle at 90% 85%, #375fb6 0%, transparent 60%);
            background-size: 60px 60px, 60px 60px, 100% 100%, 100% 100%;
            box-shadow: inset 0 0 20px #0c183a;
        }

        #marquee-display {
            font-size: var(--marquee-fontsize);
            font-weight: 400;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            height: 100%;
            transition: opacity 0.4s ease-in-out;
            opacity: 1;
            text-shadow: 2px 2px 0px #3264d6, 3px 3px 0px #04040480;
            white-space: nowrap;
        }

        #marquee-display.fade {
            opacity: 0;
        }

        /* Weather Row Styles inside Marquee */
        .weather-marquee-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            white-space: nowrap;
        }

        .temp-text {
            font-weight: 900;
        }

        .marquee-warning-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .warning-icon-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
        }

        .warning-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            vertical-align: middle;
        }

        .warning-icon-wrapper.canceled {
            opacity: 0.6;
        }

        /* 繪製 X 的對角線 */
        .warning-icon-wrapper.canceled::before,
        .warning-icon-wrapper.canceled::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 3px;
            background-color: var(--error-color);
            border-radius: 2px;
            z-index: 5;
            pointer-events: none;
        }

        .warning-icon-wrapper.canceled::before {
            transform: rotate(45deg);
        }

        .warning-icon-wrapper.canceled::after {
            transform: rotate(-45deg);
        }

        span.temp-symbol {
            font-size: calc(var(--marquee-fontsize) - 10px);
        }

        .error-text {
            color: var(--error-color);
            font-size: calc(var(--marquee-timefont) - 10px);
        }

        span.current-icon {
            display: flex;
            align-items: center;
        }

        span.current-time {
            font-size: var(--marquee-timefont);
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="weather-card">
        <div class="marquee-container">
            <div id="marquee-display">正在載入數據...</div>
        </div>
    </div>

    <script>
        const warningIcons = {
            "WFIREY": "firey", "WFIRER": "firer", "WFROST": "frost", "WHOT": "vhot",
            "WCOLD": "cold", "WTS": "ts", "WLIP": "landslip", "WMSGNL": "msn", "WL": "landslip",
            "WTMW": "tsunami-warn", "WRAINA": "raina", "WRAINR": "rainr", "WRAINB": "rainb",
            "WFNTSA": "ntfl", "WFNTERTL": "ntfl", "TC1": "tc1", "TC3": "tc3", "TC8NE": "tc8ne",
            "TC8NW": "tc8nw", "TC8SE": "tc8se", "TC8SW": "tc8sw", "TC9": "tc9", "TC10": "tc10"
        };

        let currentTemp = "--";
        let currentHumidity = "--";
        let warningIconsHtml = "";
        let iconId = "";
        let marqueeState = 1;
        let hasFetchError = false;
        let errorMessage = "";
        let timeOffset = 0; // 本機與網絡標準時間的時差 (毫秒)

        // 1. 網絡對時機制
        async function syncNetworkTime() {
            try {
                const start = Date.now();
                const res = await fetch('https://worldtimeapi.org/api/timezone/Asia/Hong_Kong');
                if (res.ok) {
                    const data = await res.json();
                    const networkTime = new Date(data.datetime).getTime();
                    const end = Date.now();
                    const latency = (end - start) / 2;
                    timeOffset = (networkTime + latency) - Date.now();
                }
            } catch (e) {
                console.warn('網絡對時失敗，將暫時使用本機系統時間:', e);
            }
        }

        // 取得校正後的精準時間
        function getAccurateNow() {
            return new Date(Date.now() + timeOffset);
        }

        function getChineseDay(dayIndex) {
            const days = ["日", "一", "二", "三", "四", "五", "六"];
            return "星期" + days.slice(dayIndex, dayIndex + 1);
        }

        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        function formatCurrentTime() {
            const now = getAccurateNow(); // 使用網絡校正後的時間
            const year = now.getFullYear();
            const month = pad(now.getMonth() + 1);
            const date = pad(now.getDate());
            const hours = pad(now.getHours());
            const minutes = pad(now.getMinutes());
            const seconds = pad(now.getSeconds());
            const dayStr = getChineseDay(now.getDay());

            return year + "年" + month + "月" + date + "日 " + dayStr + "  " + hours + ":" + minutes + ":" + seconds;
        }

        // 2. 跨域/網絡請求備援機制
        async function fetchWithFallback(url) {
            try {
                const res = await fetch(url);
                if (res.ok) return res;
            } catch (e) {
                console.log("Direct fetch failed, using fallback...");
            }

            // 使用 api.allorigins.win 繞過播放器 CORS 限制
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
            const proxyRes = await fetch(proxyUrl);
            if (!proxyRes.ok) {
                throw new Error("HTTP " + proxyRes.status);
            }
            return proxyRes;
        }

        async function fetchWeatherData() {
            try {
                const rawRhrUrl = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
                const rawWarnUrl = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc';

                const rhrResponse = await fetchWithFallback(rawRhrUrl);
                const warnResponse = await fetchWithFallback(rawWarnUrl);

                if (!rhrResponse || !warnResponse) {
                    throw new Error("Network error");
                }

                const rhrData = await rhrResponse.json();
                const warnData = await warnResponse.json();

                if (rhrData && rhrData.temperature && rhrData.temperature.data) {
                    const tempArray = rhrData.temperature.data;
                    const hkoTemp = tempArray.find(function (item) { return item.place === "筲箕灣"; })
                        || tempArray.slice(0, 1).pop();
                    if (hkoTemp) {
                        currentTemp = hkoTemp.value;
                    }
                }

                if (rhrData && rhrData.humidity && rhrData.humidity.data && rhrData.humidity.data.length > 0) {
                    const firstHumidity = rhrData.humidity.data.slice(0, 1).pop();
                    if (firstHumidity) currentHumidity = firstHumidity.value;
                }

                if (rhrData && rhrData.icon && rhrData.icon.length > 0) {
                    iconId = rhrData.icon.slice(0, 1).pop();
                }

                // 處理警告標籤
                if (warnData && Object.keys(warnData).length > 0) {
                    let tempIconsHtml = '<span class="marquee-warning-icons">';
                    let iconCount = 0;

                    for (const key in warnData) {
                        if (Object.prototype.hasOwnProperty.call(warnData, key) && iconCount < 5) {
                            const detail = warnData[key];
                            const code = detail.code;
                            const actionCode = detail.actionCode;

                            let iconName = Object.prototype.hasOwnProperty.call(warningIcons, code) ? warningIcons[code] : 'warn';
                            const isCanceled = (actionCode === 'CANCEL');

                            if (isCanceled) {
                                iconName = iconName + '_dim';
                            }

                            tempIconsHtml += `
                            <span class="warning-icon-wrapper ${isCanceled ? 'canceled' : ''}">
                                <img class="warning-icon" src="https://www.hko.gov.hk/tc/wxinfo/dailywx/images/${iconName}.gif" alt="warning">
                            </span>
                        `;
                            iconCount++;
                        }
                    }
                    tempIconsHtml += '</span>';
                    warningIconsHtml = tempIconsHtml;
                } else {
                    warningIconsHtml = "";
                }

                hasFetchError = false;
                errorMessage = "";

            } catch (error) {
                console.error('Fetch Weather Error:', error);
                hasFetchError = true;
                errorMessage = error.message || error.toString();
            }
        }

        function updateLiveClock() {
            const clockEl = document.getElementById('live-clock-target');
            if (clockEl) {
                clockEl.innerHTML = formatCurrentTime();
            }
        }

        function rotateMarqueeLoop() {
            const displayEl = document.getElementById('marquee-display');

            displayEl.classList.add('fade');

            setTimeout(function () {
                if (marqueeState === 0) {
                    displayEl.innerHTML = `<span class="current-time" id="live-clock-target">${formatCurrentTime()}</span>`;
                    marqueeState = 1;
                } else {
                    if (hasFetchError) {
                        displayEl.innerHTML = `<span class="error-text">無法顯示即時數據 (${errorMessage})</span>`;
                    } else {
                        const finalIconSrc = iconId ? `<img src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png" style="width:50px; height:50px; vertical-align:middle;" alt="Weather Status">` : '';
                        displayEl.innerHTML = `
                        <div class="weather-marquee-row">
                            <span>氣温: <span class="temp-text">${currentTemp}</span><span class="temp-symbol">°C</span></span>
                            <span>&nbsp;&nbsp;濕度: <span class="temp-text">${currentHumidity}</span><span class="temp-symbol">%</span></span>
                            <span class="current-icon">${finalIconSrc}</span>
                            <span>${warningIconsHtml}</span>
                        </div>
                    `;
                    }
                    marqueeState = 0;
                }
                displayEl.classList.remove('fade');

                const nextDelay = (marqueeState === 1) ? 60000 : 20000;
                setTimeout(rotateMarqueeLoop, nextDelay);

            }, 400);
        }

        async function initWidget() {
            await syncNetworkTime(); // 初始化對時
            await fetchWeatherData();
            rotateMarqueeLoop();
            setInterval(updateLiveClock, 1000);
            setInterval(fetchWeatherData, 200000);
            setInterval(syncNetworkTime, 3600000); // 每小時重新對時
        }

        initWidget();
    </script>
</body>

</html>
