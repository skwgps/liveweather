<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=WDXL+Lubrifont+TC&display=swap');

        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #ffffff;
            --text-muted: #718096;
            --accent-blue: #ff7d00;
            --error-color: #ff0000;
            --marquee-fontsize: 70px;
            --marquee-timefont: 70px;
        }
        
        body {
            font-family: "WDXL Lubrifont TC", "Microsoft JhengHei", "PMingLiU", sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .weather-card {
            background-color: var(--card-bg);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 1095px;
            text-align: center;
            border: 1px solid #e2e8f0;
            text-shadow: 3px 3px 0px #000000, 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        
        /* Marquee Display Area */
        .marquee-container {
            height: 121px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0 16px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: #162a65;
            background-image:
                  linear-gradient(45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.05) 75%),
                  linear-gradient(-45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.05) 75%),
                  radial-gradient(circle at 10% 15%, #375fb6  0%, transparent 60%),
                  radial-gradient(circle at 90% 85%, #375fb6 0%, transparent 60%);
            background-size: 30px 30px, 30px 30px, 100% 100%, 100% 100%;
            box-shadow: inset 0 0 30px #0c183a;
        }
        
        #marquee-display {
            font-size: var(--marquee-fontsize);
            font-weight: 400;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: opacity 0.4s ease-in-out;
            opacity: 1;
            text-shadow: 2px 2px 0px #5e91ff, 4px 4px 0px #04040433;
        }
        
        #marquee-display.fade {
            opacity: 0;
        }
        
        /* Weather Row Styles inside Marquee */
        .weather-marquee-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .temp-text {
            font-weight: 1000;
        }
        
        .marquee-warning-icons {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .warning-icon-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
        }
        
        .warning-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            vertical-align: middle;
        }
        
        .warning-icon-wrapper.canceled {
            opacity: 1; /* 輕微變暗以保持可讀性 */
        }
        
        /* 繪製 X 的第一條對角線 */
        .warning-icon-wrapper.canceled::before,
        .warning-icon-wrapper.canceled::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 2px; /* 超細線條 (可改為 1.5px 或 2px) */
            background-color: var(--error-color);
            border-radius: 1px;
            z-index: 5;
            pointer-events: none;
        }
        
        .warning-icon-wrapper.canceled::before {
            transform: rotate(45deg);
        }
        
        .warning-icon-wrapper.canceled::after {
            transform: rotate(-45deg);
        }
        
        span.temp-symbol {
            font-size: calc(var(--marquee-fontsize) - 20px);
        }
        
        .error-text {
            color: var(--error-color);
            font-size: var(--marquee-timefont);
        }
        
        span.current-icon {
            display: flex;
        }
        
        span.current-time {
            font-size: var(--marquee-timefont);
        }
    </style>
</head>

<body>

    <div class="weather-card">
        <div class="marquee-container">
            <div id="marquee-display">正在載入數據...</div>
        </div>
    </div>

    <script>
        const warningIcons = {
            "WFIREY": "firey", "WFIRER": "firer", "WFROST": "frost", "WHOT": "vhot",
            "WCOLD": "cold", "WTS": "ts", "WLIP": "landslip", "WMSGNL": "msn", "WL": "landslip",
            "WTMW": "tsunami-warn", "WRAINA": "raina", "WRAINR": "rainr", "WRAINB": "rainb",
            "WFNTSA": "ntfl", "WFNTERTL": "ntfl", "TC1": "tc1", "TC3": "tc3", "TC8NE": "tc8ne",
            "TC8NW": "tc8nw", "TC8SE": "tc8se", "TC8SW": "tc8sw", "TC9": "tc9", "TC10": "tc10"
        };
        
        let currentTemp = "--";
        let currentHumidity = "--";
        let warningIconsHtml = "";
        let iconId = "";
        let marqueeState = 1; // 0 = Display Time, 1 = Display Weather Status
        
        let hasFetchError = false;
        
        function getChineseDay(dayIndex) {
            const days = ["日", "一", "二", "三", "四", "五", "六"];
            return `星期${days[dayIndex]}`;
        }
        
        function pad(num) {
            return num.toString().padStart(2, '0');
        }
        
        function formatCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = pad(now.getMonth() + 1);
            const date = pad(now.getDate());
            const hours = pad(now.getHours());
            const minutes = pad(now.getMinutes());
            const seconds = pad(now.getSeconds());
            const dayStr = getChineseDay(now.getDay());
        
            return `${year}年${month}月${date}日　${dayStr}　${hours}:${minutes}:${seconds} `;
        }
        
        function formatWeatherTime() {
            const now = new Date();
            const hours = pad(now.getHours());
            const minutes = pad(now.getMinutes());
        
            return `${hours}:${minutes}Updated`;
        }
        
        async function fetchWeatherData() {
            try {
                const rhrResponse = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const warnResponse = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        
                if (!rhrResponse.ok || !warnResponse.ok) {
                    throw new Error("HTTP connection error checking status paths");
                }
        
                const rhrData = await rhrResponse.json();
                const warnData = await warnResponse.json();
        
                const hkoTemp = rhrData.temperature.data.find(function (item) { return item.place === "筲箕灣"; });
                if (hkoTemp) {
                    currentTemp = hkoTemp.value;
                }
        
                if (rhrData.humidity && rhrData.humidity.data && rhrData.humidity.data.length > 0) {
                    currentHumidity = rhrData.humidity.data.at(0).value;
                }
        
                if (rhrData.icon && rhrData.icon.length > 0) {
                    iconId = rhrData.icon.at(0);
                }
        
                if (warnData && Object.keys(warnData).length > 0) {
                    let tempIconsHtml = '<span class="marquee-warning-icons">';
                    let iconCount = 0; 
        
                    for (const key in warnData) {
                        if (Object.prototype.hasOwnProperty.call(warnData, key) && iconCount < 5) {
                            const detail = warnData[key];
                            const code = detail.code;
                            const actionCode = detail.actionCode;
        
                            let iconName = Object.prototype.hasOwnProperty.call(warningIcons, code) ? warningIcons[code] : 'warn';
                            const isCanceled = (actionCode === 'CANCEL');
        
                            if (isCanceled) {
                                iconName = `${iconName}_dim`;
                            }
                            console.log(iconName)
                            
                            // 用 <span> 包裝，如果是取消狀態就加上 canceled class
                            tempIconsHtml += `
                                <span class="warning-icon-wrapper ${isCanceled ? 'canceled' : ''}">
                                    <img class="warning-icon" src="https://www.hko.gov.hk/tc/wxinfo/dailywx/images/${iconName}.gif" alt="warning">
                                </span>
                            `;
                            iconCount = iconCount + 1;
                        }
                    }
                    tempIconsHtml += '</span>';
                    warningIconsHtml = tempIconsHtml;
                } else {
                    warningIconsHtml = "";
                }
        
                hasFetchError = false;
        
            } catch (error) {
                console.error('Error updates tracking local metrics:', error);
                hasFetchError = true;
            }
        }
        
        function updateLiveClock() {
            const clockEl = document.getElementById('live-clock-target');
            if (clockEl) {
                clockEl.innerHTML = formatCurrentTime();
            }
        }
        
        function rotateMarqueeLoop() {
            const displayEl = document.getElementById('marquee-display');
        
            displayEl.classList.add('fade');
        
            setTimeout(function () {
                if (marqueeState === 0) {
                    displayEl.innerHTML = `<span class="current-time" id="live-clock-target">${formatCurrentTime()}</span>`;
                    marqueeState = 1;
                } else {
                    if (hasFetchError) {
                        displayEl.innerHTML = `<span class="error-text">無法顯示即時數據</span>`;
                    } else {
                        const finalIconSrc = iconId ? `<img src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png" style="width:60px; height:60px; vertical-align:middle;" alt="Weather Status">` : '';
                        displayEl.innerHTML = `
                    <div class="weather-marquee-row">
                        <span>氣温: <span class="temp-text">${currentTemp}</span><span class="temp-symbol">°C</span>&nbsp;&nbsp;&nbsp;&nbsp;</span>
                        <span>濕度: <span class="temp-text">${currentHumidity}</span><span class="temp-symbol">%</span></span>
                        <span class="current-icon">${finalIconSrc}</span>
                        <span>${warningIconsHtml}</span>
                    </div>
                `;
                    }
                    marqueeState = 0;
                }
                displayEl.classList.remove('fade');
        
                const nextDelay = (marqueeState === 1) ? 60000 : 20000;
                setTimeout(rotateMarqueeLoop, nextDelay);
        
            }, 400);
        }
        
        async function initWidget() {
            await fetchWeatherData();
            rotateMarqueeLoop();
            setInterval(updateLiveClock, 1000);
            setInterval(fetchWeatherData, 200000);
        }
        
        initWidget();
    </script>
</body>

</html>
