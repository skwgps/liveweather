<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #ffffff;
            --text-muted: #718096;
            --accent-blue: #ff7d00;
            --error-color: #e53e3e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .weather-card {
            background-color: var(--card-bg);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 1080px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .hko-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
        }

        /* Marquee Display Area */
        .marquee-container {
            height: 121px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #1e3a8a;
            border: 1px solid #e2e8f0;
            padding: 0 16px;
            position: relative;
        }

        #marquee-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: opacity 0.4s ease-in-out;
            opacity: 1;
        }

        #marquee-display.fade {
            opacity: 0;
        }

        /* Weather Row Styles inside Marquee */
        .weather-marquee-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .temp-text {
            color: var(--accent-blue);
        }

        .marquee-warning-icons {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .warning-icon {
            width: 30px;
            height: 30px;
            object-fit: contain;
            vertical-align: middle;
        }

        span.temp-symbol {
            font-size: 1.2rem;
        }

        .error-text {
            color: var(--error-color);
            font-size: 1.8rem;
        }

        span.weather-update-time {
            font-size: 12px;
            position: absolute;
            bottom: 0;
            left: 10px;
        }

        span.current-icon {
            display: flex;
        }

        span.current-time {
            font-size: 1.9rem;
        }
    </style>
</head>

<body>

    <div class="weather-card">
        <div class="marquee-container">
            <div id="marquee-display">正在載入數據...</div>
        </div>
    </div>

    <script>
        const warningIcons = {
            "WFIREY": "fireyellow", "WFIRER": "firered", "WFROST": "frost", "WHOT": "hot",
            "WCOLD": "cold", "WTS": "ts", "WLIP": "landslip", "WMSGNL": "sms", "WL": "ls",
            "WTMW": "tsunami", "WRAINA": "rainamber", "WRAINR": "rainred", "WRAINB": "rainblack",
            "WFNTSA": "northflood", "WFNTERTL": "northflood", "TC1": "tc1", "TC3": "tc3", "TC8NE": "tc08ne",
            "TC8NW": "tc08nw", "TC8SE": "tc08se", "TC8SW": "tc08sw", "TC9": "tc09", "TC10": "tc10"
        };

        // Cache system data states globally
        let currentTemp = "--";
        let currentHumidity = "--";
        let warningIconsHtml = "";
        let iconId = "";
        let marqueeState = 0; // 0 = Display Time, 1 = Display Weather Status

        // Track API errors cleanly without breaking state loops
        let hasFetchError = false;

        function getChineseDay(dayIndex) {
            const days = ["日", "一", "二", "三", "四", "五", "六"];
            return `星期${days[dayIndex]}`;
        }

        // Helper: Zero pads time digits
        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        // Generates Time layout string
        function formatCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = pad(now.getMonth() + 1);
            const date = pad(now.getDate());
            const hours = pad(now.getHours());
            const minutes = pad(now.getMinutes());
            const seconds = pad(now.getSeconds());
            const dayStr = getChineseDay(now.getDay());

            return `${year}年${month}月${date}日 ${dayStr} ${hours}:${minutes}:${seconds} `;
        }

        // Generates Update Time for Weather 
        function formatWeatherTime() {
            const now = new Date();
            const hours = pad(now.getHours());
            const minutes = pad(now.getMinutes());

            return `${hours}:${minutes}Updated`;
        }

        // Fetch Live Weather & Warnings Framework Data
        async function fetchWeatherData() {
            try {
                const rhrResponse = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const warnResponse = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warningInfo&lang=tc');

                if (!rhrResponse.ok || !warnResponse.ok) {
                    throw new Error("HTTP connection error checking status paths");
                }

                const rhrData = await rhrResponse.json();
                const warnData = await warnResponse.json();
                /* const warnData = {
                     "details": [
                         { "warningStatementCode": "WTS", "contents": [] },
                         { "warningStatementCode": "WRAINB", "contents": [] },
                         { "warningStatementCode": "WFNTSA", "contents": [] },
                         { "warningStatementCode": "WFNTSA", "contents": [] },
                        { "warningStatementCode": "WFNTSA", "contents": [] },
                       { "warningStatementCode": "WFNTSA", "contents": [] }
                       ]
                 }; */
                const hkoTemp = rhrData.temperature.data.find(function (item) { return item.place === "筲箕灣"; });
                if (hkoTemp) {
                    currentTemp = hkoTemp.value;
                }

                if (rhrData.humidity && rhrData.humidity.data && rhrData.humidity.data.length > 0) {
                    currentHumidity = rhrData.humidity.data.at(0).value;
                }

                if (rhrData.icon && rhrData.icon.length > 0) {
                    iconId = rhrData.icon.at(0);
                }

                if (warnData.details && warnData.details.length > 0) {
                    let tempIconsHtml = '<span class="marquee-warning-icons">';
                    let iconCount = 0; // Track the number of icons added
                    warnData.details.forEach(function (detail) {
                        if (iconCount < 5) {
                            const code = detail.warningStatementCode;
                            const iconName = Object.prototype.hasOwnProperty.call(warningIcons, code) ? warningIcons[code] : 'warn';
                            tempIconsHtml += `<img class="warning-icon" src="https://www.hko.gov.hk/tc/textonly/img/warn/images/${iconName}.png" alt="warning">`;

                            iconCount = iconCount + 1; // Increment without using index symbols
                        }
                    });
                    tempIconsHtml += '</span>';
                    warningIconsHtml = tempIconsHtml;
                } else {
                    warningIconsHtml = "";
                }

                hasFetchError = false;

            } catch (error) {
                console.error('Error updates tracking local metrics:', error);
                hasFetchError = true;
            }
        }

        function updateLiveClock() {
            const clockEl = document.getElementById('live-clock-target');
            if (clockEl) {
                clockEl.innerHTML = formatCurrentTime();
            }
        }

        // Handle structural views cross-fade loops smoothly every 10 seconds
        function rotateMarqueeLoop() {
            const displayEl = document.getElementById('marquee-display');

            // Step 1: Trigger CSS opacity dip
            displayEl.classList.add('fade');

            // Step 2: Swap content mid-fade, then scale view back up
            setTimeout(function () {
                if (marqueeState === 0) {
                    // Loop Option A: Render Current Live Stamp (Always works even on API crashes)
                    displayEl.innerHTML = `<span class="current-time" id="live-clock-target">${formatCurrentTime()}</span>`;
                    marqueeState = 1;
                } else {
                    // Loop Option B: Render Weather Status OR Error fallback message smoothly
                    if (hasFetchError) {
                        displayEl.innerHTML = `<span class="error-text">無法顯示即時數據</span>`;
                    } else {
                        const finalIconSrc = iconId ? `<img src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic${iconId}.png" style="width:40px; height:40px; vertical-align:middle;" alt="Weather Status">` : '';
                        displayEl.innerHTML = `
                <div class="weather-marquee-row">
                    <span>氣溫: <span class="temp-text">${currentTemp}</span><span class="temp-symbol">°C</span>&nbsp;&nbsp;&nbsp;&nbsp;</span>
                    <span>濕度: <span class="temp-text">${currentHumidity}</span><span class="temp-symbol">%</span></span>
                    <span class="current-icon">${finalIconSrc}</span>
                    <span>${warningIconsHtml}</span>
                </div>
                <span class="weather-update-time">${formatWeatherTime()}</span>
            `;
                    }
                    marqueeState = 0;
                }
                displayEl.classList.remove('fade');
            }, 400);
        }

        async function initWidget() {
            await fetchWeatherData();
            rotateMarqueeLoop();
            setInterval(updateLiveClock, 1000);
            setInterval(rotateMarqueeLoop, 30000);
            setInterval(fetchWeatherData, 200000);
        }

        initWidget();
    </script>
</body>

</html>
